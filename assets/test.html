<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input placeholder="Digite o nome do personagem" id="nome">
    <input placeholder="Digite o poder do personagem" id="poder">
    <button onclick="registrar()">Salvar</button>
    <p></p>

    <script>
        function registrar(){
            let nome = document.getElementById("nome").value;
            let poder = document.getElementById("poder").value;

            document.querySelector("p").innerHTML = `O personagem é ${nome} e poder é ${poder}.`;
        }
    </script>
</body>
</html>
